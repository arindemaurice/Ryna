[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ryna"
version = "0.1.0"
description = "RYNA — Cross-platform personal AI assistant, companion, and autonomous agent"
readme = "README.md"
requires-python = ">=3.11"
# Core RYNA runtime intentionally uses Python's standard library (zero required third-party deps)
# so it runs reliably out-of-the-box offline on Windows, macOS, and Linux.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
voice-offline = [
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
]
documents = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
system = [
    "psutil>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
